name: VSP Account Scoped Team Membership Lookup
on:
  workflow_dispatch:
  push:
    branches: [uxlp-44-implementation]
    paths:
      - 'lib/core/repositories/team_repository.dart'
      - 'lib/core/services/active_team_service.dart'
      - 'test/core/repositories/team_membership_lookup_test.dart'
      - '.github/workflows/vsp-team-membership-scope.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/core/repositories/team_repository.dart'
      - 'lib/core/services/active_team_service.dart'
      - 'test/core/repositories/team_membership_lookup_test.dart'
      - '.github/workflows/vsp-team-membership-scope.yml'
permissions:
  contents: read
concurrency:
  group: vsp-team-membership-scope-${{ github.ref }}
  cancel-in-progress: true
jobs:
  team-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze scoped membership and active-team source
        run: >-
          flutter analyze --no-fatal-infos
          lib/core/repositories/team_repository.dart
          lib/core/services/active_team_service.dart
          test/core/repositories/team_membership_lookup_test.dart
      - name: Test team memberships with two accounts, duplicates and failure
        run: flutter test --concurrency=1 test/core/repositories/team_membership_lookup_test.dart
