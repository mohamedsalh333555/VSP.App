name: Team League Refund Status Contract

permissions:
  contents: read

on:
  push:
    branches: [uxlp-44-implementation]
    paths:
      - '.github/workflows/team-league-refund-status-contract.yml'
      - 'supabase/migrations/20261117173000_align_team_league_payment_refund_states.sql'
      - 'supabase/tests/team_league_payment_refund_status_isolated_contract.sql'
  workflow_dispatch:

concurrency:
  group: team-league-refund-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-refund-state-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: vsp_team_league_refund_isolated
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vsp_ephemeral_ci_only
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: vsp_team_league_refund_isolated
      PGUSER: postgres
      PGPASSWORD: vsp_ephemeral_ci_only
    steps:
      - uses: actions/checkout@v4
      - name: Assert connection is isolated disposable CI PostgreSQL
        run: |
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "vsp_team_league_refund_isolated"
          psql -v ON_ERROR_STOP=1 -Atc "SELECT current_database()" | grep -Fx 'vsp_team_league_refund_isolated'
      - name: Test migration and reject unknown payment states
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/team_league_payment_refund_status_isolated_contract.sql
