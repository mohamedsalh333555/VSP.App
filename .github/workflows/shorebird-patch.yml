name: VSP Shorebird Patch

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version to patch (for example 1.0.0+1)"
        required: true
        type: string
      track:
        description: "Deployment track"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - stable

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  patch-android:
    name: Android OTA Patch
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Validate Shorebird configuration
        run: |
          test -f shorebird.yaml
          test -n "${SHOREBIRD_TOKEN}"
          shorebird doctor

      - name: Shorebird Patch
        uses: shorebirdtech/shorebird-patch@v1
        with:
          platform: android
          release-version: ${{ inputs.release_version }}
          args: "--track=${{ inputs.track }} --verbose"
