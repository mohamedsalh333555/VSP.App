name: VSP Shorebird Patch

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version to patch (for example 1.0.0+1)"
        required: true
        type: string
      track:
        description: "Deployment track"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - staging

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  patch-android:
    name: Android OTA Patch
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare Firebase Android config
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "860837572098",
              "project_id": "vsp-app-103b1",
              "storage_bucket": "vsp-app-103b1.firebasestorage.app"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:860837572098:android:5a9d7594b32d94b1e5c11b",
                "android_client_info": {
                  "package_name": "app.vsp.sports"
                }
              },
              "api_key": [{
                "current_key": "AIzaSyBxfM4csK8u13t80oHOT8I9aMKGx-pe4EM"
              }]
            }]
          }
          EOF
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - name: Validate required build configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PAYMOB_PUBLIC_KEY: ${{ secrets.PAYMOB_PUBLIC_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          test -f shorebird.yaml
          test -n "${SHOREBIRD_TOKEN}"
          test -n "${SUPABASE_URL}"
          test -n "${SUPABASE_ANON_KEY}"
          test -n "${PAYMOB_PUBLIC_KEY}"
          test -n "${GOOGLE_WEB_CLIENT_ID}"
          test -n "${GOOGLE_IOS_CLIENT_ID}"
          shorebird doctor
      - name: Decode Android keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/keystore.jks"
      - name: Create Android key.properties
        run: |
          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          keyAlias=${{ secrets.KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          storeFile=$GITHUB_WORKSPACE/keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF
      - name: Shorebird Patch
        uses: shorebirdtech/shorebird-patch@v1
        id: shorebird-patch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PAYMOB_PUBLIC_KEY: ${{ secrets.PAYMOB_PUBLIC_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        with:
          platform: android
          release-version: ${{ inputs.release_version }}
          args: >-
            --track=${{ inputs.track }}
            --verbose
            --
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            --dart-define=PAYMOB_PUBLIC_KEY=${{ secrets.PAYMOB_PUBLIC_KEY }}
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}
      - name: Print patch number
        run: echo "Shorebird patch: ${{ steps.shorebird-patch.outputs.patch-number }}"
