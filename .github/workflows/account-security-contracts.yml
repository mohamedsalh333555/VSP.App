name: Account SQL security contracts

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [uxlp-44-implementation]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/run_account_security_contracts.py'
      - 'scripts/admin_rpc_guard_plan.py'
      - 'test/tooling/test_admin_rpc_guard_plan.py'
      - 'test/tooling/test_account_security_runner.py'
      - '.github/workflows/account-security-contracts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/run_account_security_contracts.py'
      - 'scripts/admin_rpc_guard_plan.py'
      - 'test/tooling/test_admin_rpc_guard_plan.py'
      - 'test/tooling/test_account_security_runner.py'
      - '.github/workflows/account-security-contracts.yml'

concurrency:
  group: account-sql-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: vsp_security_contracts
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vsp_ephemeral_ci_only
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VSP_CONTRACT_ISOLATED: '1'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: vsp_security_contracts
      PGUSER: postgres
      PGPASSWORD: vsp_ephemeral_ci_only
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner refuses non-isolated targets
        run: python3 -m unittest discover -s test/tooling -p test_account_security_runner.py -v
      - name: Verify source fingerprint planner
        run: python3 -m unittest discover -s test/tooling -p test_admin_rpc_guard_plan.py -v
      - name: Execute SQL authorization suites and negative gate controls
        run: python3 scripts/run_account_security_contracts.py
      - name: Verify an existing contract database cannot be reinitialised
        run: |
          python3 - <<'PY'
          import subprocess, sys
          result = subprocess.run([sys.executable, 'scripts/run_account_security_contracts.py'],
                                  text=True, capture_output=True)
          if result.returncode == 0 or 'CONTRACT_DATABASE_NOT_FRESH' not in result.stderr:
              raise SystemExit('Fresh-database protection failed')
          print('PASS: existing database refused before fixture installation')
          PY
