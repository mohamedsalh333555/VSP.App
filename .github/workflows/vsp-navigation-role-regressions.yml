name: VSP Navigation Role and Notification Security

on:
  workflow_dispatch:
  push:
    branches: [uxlp-44-implementation]
    paths:
      - ".github/workflows/vsp-navigation-role-regressions.yml"
      - "lib/core/navigation/app_router.dart"
      - "lib/core/navigation/root_screen.dart"
      - "lib/core/navigation/pending_deep_link_account_guard.dart"
      - "test/core/navigation/pending_deep_link_account_guard_test.dart"
      - "lib/core/navigation/app_route_role_guard.dart"
      - "lib/core/services/notification_service.dart"
      - "lib/features/player/screens/notifications_center_screen.dart"
      - "test/deep_link_abuse_test.dart"
      - "test/root_screen_routing_test.dart"
      - "test/auth_forgot_password_and_roles_test.dart"
      - "test/helpers/router_auth_fakes.dart"
      - "lib/core/utils/deep_link_helper.dart"
      - "lib/main.dart"
      - "lib/core/providers/auth/auth_oauth_coordinator.dart"
      - "test/core/utils/deep_link_origin_validation_test.dart"
      - "test/architecture/notification_role_billing_route_guard_test.dart"
      - "test/architecture/notification_navigation_account_guard_test.dart"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/vsp-navigation-role-regressions.yml"
      - "lib/core/navigation/app_router.dart"
      - "lib/core/navigation/root_screen.dart"
      - "lib/core/navigation/pending_deep_link_account_guard.dart"
      - "test/core/navigation/pending_deep_link_account_guard_test.dart"
      - "lib/core/navigation/app_route_role_guard.dart"
      - "lib/features/player/screens/notifications_center_screen.dart"
      - "test/deep_link_abuse_test.dart"
      - "test/root_screen_routing_test.dart"
      - "test/auth_forgot_password_and_roles_test.dart"
      - "test/helpers/router_auth_fakes.dart"
      - "lib/core/utils/deep_link_helper.dart"
      - "lib/main.dart"
      - "lib/core/providers/auth/auth_oauth_coordinator.dart"
      - "test/core/utils/deep_link_origin_validation_test.dart"
      - "test/architecture/notification_role_billing_route_guard_test.dart"

permissions:
  contents: read
concurrency:
  group: vsp-navigation-role-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true
      - name: Install Flutter packages
        run: flutter pub get
      - name: Analyze role routing and notification consumers
        run: >-
          flutter analyze --no-fatal-infos
          lib/core/navigation/app_router.dart
          lib/core/navigation/root_screen.dart
          lib/core/navigation/pending_deep_link_account_guard.dart
          test/core/navigation/pending_deep_link_account_guard_test.dart
          lib/core/navigation/app_route_role_guard.dart
          lib/core/utils/deep_link_helper.dart
          lib/main.dart
          test/core/utils/deep_link_origin_validation_test.dart
          lib/features/player/screens/notifications_center_screen.dart
          test/deep_link_abuse_test.dart
          test/root_screen_routing_test.dart
          test/auth_forgot_password_and_roles_test.dart
          test/helpers/router_auth_fakes.dart
          test/core/navigation/pending_deep_link_account_guard_test.dart
          test/architecture/notification_role_billing_route_guard_test.dart
      - name: Test deep links, signed-in role redirects, notification account scope
        run: >-
          flutter test --concurrency=1
          test/deep_link_abuse_test.dart
          test/root_screen_routing_test.dart
          test/auth_forgot_password_and_roles_test.dart
          test/helpers/router_auth_fakes.dart
          test/core/utils/deep_link_origin_validation_test.dart
          test/architecture/notification_role_billing_route_guard_test.dart
          test/architecture/notification_navigation_account_guard_test.dart
