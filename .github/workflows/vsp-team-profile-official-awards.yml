name: VSP Team Profile and Official Awards UX
on:
  workflow_dispatch:
  push:
    branches: [uxlp-44-implementation]
    paths:
      - 'lib/features/player/widgets/champion/team_skills_history_section.dart'
      - 'lib/core/repositories/matchup_repository.dart'
      - 'lib/features/player/widgets/team_profile/team_profile_head_to_head_section.dart'
      - 'lib/features/player/widgets/team_profile/team_profile_head_to_head_panel.dart'
      - 'lib/features/player/widgets/team_profile/team_profile_hero_header.dart'
      - 'lib/features/player/widgets/team_profile/team_profile_stats_grid.dart'
      - 'lib/features/player/widgets/team_profile/team_profile_roster_section.dart'
      - 'test/features/player/team_roster_name_localization_test.dart'
      - 'lib/features/player/widgets/my_team/team_stats_header.dart'
      - 'lib/features/player/widgets/team_profile/team_matchup_invite_modal.dart'
      - 'test/features/player/team_matchup_invite_modal_privacy_test.dart'
      - 'lib/features/player/screens/team_profile_screen.dart'
      - 'lib/features/player/services/team_matchup_invite_guard.dart'
      - 'test/features/player/team_matchup_invite_guard_test.dart'
      - 'test/features/player/team_profile_verified_rank_presentation_test.dart'
      - 'test/features/player/team_profile_member_count_authority_test.dart'
      - 'test/features/player/my_team_stats_historical_awards_trust_test.dart'
      - 'test/features/player/team_profile_official_awards_history_test.dart'
      - 'lib/features/player/widgets/vsp_1v1_trophy_badge.dart'
      - 'test/features/player/legacy_1v1_badge_presentation_test.dart'
      - 'test/vsp_1v1_trophy_badge_test.dart'
      - 'test/features/player/team_profile_head_to_head_panel_test.dart'
      - '.github/workflows/vsp-team-profile-official-awards.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/player/widgets/champion/team_skills_history_section.dart'
      - 'lib/core/repositories/matchup_repository.dart'
      - 'lib/features/player/widgets/team_profile/team_profile_head_to_head_section.dart'
      - 'lib/features/player/widgets/team_profile/team_profile_head_to_head_panel.dart'
      - 'lib/features/player/widgets/team_profile/team_profile_hero_header.dart'
      - 'lib/features/player/widgets/team_profile/team_profile_stats_grid.dart'
      - 'lib/features/player/widgets/team_profile/team_profile_roster_section.dart'
      - 'test/features/player/team_roster_name_localization_test.dart'
      - 'lib/features/player/widgets/my_team/team_stats_header.dart'
      - 'lib/features/player/widgets/team_profile/team_matchup_invite_modal.dart'
      - 'test/features/player/team_matchup_invite_modal_privacy_test.dart'
      - 'lib/features/player/screens/team_profile_screen.dart'
      - 'lib/features/player/services/team_matchup_invite_guard.dart'
      - 'test/features/player/team_matchup_invite_guard_test.dart'
      - 'test/features/player/team_profile_verified_rank_presentation_test.dart'
      - 'test/features/player/team_profile_member_count_authority_test.dart'
      - 'test/features/player/my_team_stats_historical_awards_trust_test.dart'
      - 'test/features/player/team_profile_official_awards_history_test.dart'
      - 'lib/features/player/widgets/vsp_1v1_trophy_badge.dart'
      - 'test/features/player/legacy_1v1_badge_presentation_test.dart'
      - 'test/vsp_1v1_trophy_badge_test.dart'
      - 'test/features/player/team_profile_head_to_head_panel_test.dart'
      - '.github/workflows/vsp-team-profile-official-awards.yml'
permissions:
  contents: read
concurrency:
  group: vsp-team-profile-official-awards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  team-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze team profile and award presentation
        run: >-
          flutter analyze --no-fatal-infos
          lib/features/player/widgets/champion/team_skills_history_section.dart
          lib/features/player/widgets/team_profile/team_profile_head_to_head_section.dart
          lib/features/player/widgets/team_profile/team_profile_head_to_head_panel.dart
          lib/features/player/widgets/team_profile/team_profile_hero_header.dart
          lib/features/player/widgets/vsp_1v1_trophy_badge.dart
          test/features/player/legacy_1v1_badge_presentation_test.dart
          test/vsp_1v1_trophy_badge_test.dart
          test/features/player/team_profile_official_awards_history_test.dart
          test/features/player/team_profile_head_to_head_panel_test.dart
          lib/features/player/widgets/team_profile/team_profile_stats_grid.dart
          lib/features/player/widgets/team_profile/team_profile_roster_section.dart
          test/features/player/team_roster_name_localization_test.dart
          lib/features/player/widgets/my_team/team_stats_header.dart
          lib/features/player/screens/team_profile_screen.dart
          lib/features/player/services/team_matchup_invite_guard.dart
          lib/features/player/widgets/team_profile/team_matchup_invite_modal.dart
          test/features/player/team_matchup_invite_modal_privacy_test.dart
          test/features/player/team_matchup_invite_guard_test.dart
          test/features/player/team_profile_verified_rank_presentation_test.dart
          test/features/player/team_profile_member_count_authority_test.dart
          test/features/player/my_team_stats_historical_awards_trust_test.dart
      - name: Test team profile, official award visibility and RTL/English totals
        run: >-
          flutter test --concurrency=1
          test/features/player/legacy_1v1_badge_presentation_test.dart
          test/vsp_1v1_trophy_badge_test.dart
          test/features/player/team_profile_official_awards_history_test.dart
          test/features/player/team_profile_head_to_head_panel_test.dart
          test/features/player/team_profile_verified_rank_presentation_test.dart
          test/features/player/team_profile_member_count_authority_test.dart
          test/features/player/my_team_stats_historical_awards_trust_test.dart
          test/features/player/team_roster_name_localization_test.dart
          test/features/player/team_matchup_invite_guard_test.dart
          test/features/player/team_matchup_invite_modal_privacy_test.dart
