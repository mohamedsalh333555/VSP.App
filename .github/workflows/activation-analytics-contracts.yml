name: VSP Offline Activation Analytics Contracts

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/activation-analytics-contracts.yml"
      - "scripts/vsp_activation_dashboard.html"
      - "scripts/test_vsp_activation_dashboard.cjs"
      - "lib/core/services/activation_funnel_contract.dart"
      - "lib/core/services/retention_cohort_contract.dart"
      - "test/core/services/activation_funnel_contract_test.dart"
      - "test/core/services/retention_cohort_contract_test.dart"

permissions:
  contents: read

jobs:
  offline-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate private offline reporting viewer
        run: node --test scripts/test_vsp_activation_dashboard.cjs
