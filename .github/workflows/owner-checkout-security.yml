name: Owner checkout security

on:
  workflow_dispatch:
  push:
    branches: [uxlp-44-implementation]
    paths:
      - "supabase/functions/_shared/**"
      - "supabase/functions/create_owner_web_checkout/**"
      - "supabase/functions/get_owner_web_checkout_status/**"
      - "supabase/functions/paymob_webhook/**"
      - "supabase/functions/tests/**"
      - ".github/workflows/owner-checkout-security.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/owner-checkout-security.yml"

permissions:
  contents: read

concurrency:
  group: owner-checkout-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-request-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.2.12"
      - name: Type-check and test real checkout handlers without network or secrets
        run: deno test --no-config supabase/functions/tests/owner_checkout_test.ts
