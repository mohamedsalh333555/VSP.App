name: VSP UXLP 44 Rule Screen Map
on:
  workflow_dispatch:
  push:
    branches: [uxlp-44-implementation]
    paths:
      - 'docs/UXLP_44_RULE_AUDIT.md'
      - 'docs/UXLP_44_SCREEN_REGISTER.md'
      - 'docs/VSP_UXLP_44_RULE_SCREEN_MAP_01_01_2026-11-19.md'
      - 'scripts/test_uxlp_rule_screen_map.cjs'
      - 'docs/VSP_UXLP_44_CONFORMANCE_EVIDENCE_01_05_2026-11-20.md'
      - 'scripts/test_uxlp_conformance_evidence.cjs'
      - '.github/workflows/vsp-uxlp-rule-screen-map.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/UXLP_44_RULE_AUDIT.md'
      - 'docs/UXLP_44_SCREEN_REGISTER.md'
      - 'docs/VSP_UXLP_44_RULE_SCREEN_MAP_01_01_2026-11-19.md'
      - 'scripts/test_uxlp_rule_screen_map.cjs'
      - 'docs/VSP_UXLP_44_CONFORMANCE_EVIDENCE_01_05_2026-11-20.md'
      - 'scripts/test_uxlp_conformance_evidence.cjs'
      - '.github/workflows/vsp-uxlp-rule-screen-map.yml'
permissions:
  contents: read
concurrency:
  group: uxlp-rule-screen-map-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-source-links:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify forty-four rule to source screen mappings
        run: node --test scripts/test_uxlp_rule_screen_map.cjs scripts/test_uxlp_conformance_evidence.cjs
