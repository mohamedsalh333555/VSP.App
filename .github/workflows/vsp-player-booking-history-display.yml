name: VSP Player Booking History Display

on:
  workflow_dispatch:
  push:
    branches: [uxlp-44-implementation]
    paths:
      - 'lib/features/player/screens/bookings_screen.dart'
      - 'test/features/player/bookings_screen_test.dart'
      - '.github/workflows/vsp-player-booking-history-display.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/player/screens/bookings_screen.dart'
      - 'test/features/player/bookings_screen_test.dart'
      - '.github/workflows/vsp-player-booking-history-display.yml'
permissions:
  contents: read
concurrency:
  group: player-booking-history-${{ github.ref }}
  cancel-in-progress: true
jobs:
  user-booking-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze personal booking screen and widget contract
        run: >-
          flutter analyze --no-fatal-infos
          lib/features/player/screens/bookings_screen.dart
          test/features/player/bookings_screen_test.dart
      - name: Verify visible upcoming/history bookings and ordered scrolling
        run: flutter test --concurrency=1 test/features/player/bookings_screen_test.dart
