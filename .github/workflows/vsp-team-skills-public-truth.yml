name: VSP Team Skills Published Data Truth
on:
  workflow_dispatch:
  push:
    branches: [uxlp-44-implementation]
    paths:
      - 'lib/features/player/widgets/champion/team_skills_published_details.dart'
      - 'lib/features/player/services/team_skills_ranking_service.dart'
      - 'test/features/player/team_skills_published_details_test.dart'
      - 'test/features/player/team_skills_approved_rank_completion_test.dart'
      - 'test/unit/team_skills_ranking_service_test.dart'
      - '.github/workflows/vsp-team-skills-public-truth.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/player/widgets/champion/team_skills_published_details.dart'
      - 'lib/features/player/services/team_skills_ranking_service.dart'
      - 'test/features/player/team_skills_published_details_test.dart'
      - 'test/features/player/team_skills_approved_rank_completion_test.dart'
      - 'test/unit/team_skills_ranking_service_test.dart'
      - '.github/workflows/vsp-team-skills-public-truth.yml'
permissions:
  contents: read
concurrency:
  group: team-skills-public-truth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  published-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze Team Skills verified-public views
        run: >-
          flutter analyze --no-fatal-infos
          lib/features/player/widgets/champion/team_skills_published_details.dart
          lib/features/player/services/team_skills_ranking_service.dart
          test/features/player/team_skills_published_details_test.dart
          test/features/player/team_skills_approved_rank_completion_test.dart
          test/unit/team_skills_ranking_service_test.dart
      - name: Test published capacity, prizes and ranking truth
        run: >-
          flutter test --concurrency=1
          test/features/player/team_skills_published_details_test.dart
          test/features/player/team_skills_approved_rank_completion_test.dart
          test/unit/team_skills_ranking_service_test.dart
