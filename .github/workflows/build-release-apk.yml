name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-release-apk:
    name: Build VSP Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Firebase Android config
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "860837572098",
              "project_id": "vsp-app-103b1",
              "storage_bucket": "vsp-app-103b1.firebasestorage.app"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:860837572098:android:5a9d7594b32d94b1e5c11b",
                "android_client_info": {
                  "package_name": "app.vsp.sports"
                }
              },
              "api_key": [{
                "current_key": "AIzaSyBxfM4csK8u13t80oHOT8I9aMKGx-pe4EM"
              }]
            }]
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Create temporary CI release keystore
        shell: bash
        run: |
          keytool -genkeypair -v             -keystore "${{ runner.temp }}/vsp-ci-release.jks"             -storepass "vsp-ci-test"             -keypass "vsp-ci-test"             -alias "vsp-key"             -keyalg RSA             -keysize 2048             -validity 3650             -dname "CN=VSP CI Test, OU=VSP, O=VSP, L=Aswan, ST=Aswan, C=EG"
          cat > android/key.properties <<EOF
          storePassword=vsp-ci-test
          keyPassword=vsp-ci-test
          keyAlias=vsp-key
          storeFile=${{ runner.temp }}/vsp-ci-release.jks
          EOF

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Locate generated APK
        run: |
          find build/app/outputs -type f -name "*.apk" -print
          test -n "$(find build/app/outputs -type f -name "*.apk" -print -quit)"

      - name: Upload VSP Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vsp_app_release
          path: build/app/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean CI signing files
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties
          rm -f "${{ runner.temp }}/vsp-ci-release.jks"
