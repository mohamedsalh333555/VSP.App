name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-release-apk:
    name: Build VSP Test Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h /

      - name: Prepare Firebase Android config
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "860837572098",
              "project_id": "vsp-app-103b1",
              "storage_bucket": "vsp-app-103b1.firebasestorage.app"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:860837572098:android:5a9d7594b32d94b1e5c11b",
                "android_client_info": {
                  "package_name": "app.vsp.sports"
                }
              },
              "api_key": [{
                "current_key": "AIzaSyBxfM4csK8u13t80oHOT8I9aMKGx-pe4EM"
              }]
            }]
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build installable test Release APK
        env:
          VSP_TEST_RELEASE_APK: "true"
        shell: bash
        run: |
          DART_DEFINES=()
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            DART_DEFINES+=(--dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}")
          fi
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            DART_DEFINES+=(--dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}")
          fi
          if [ -n "${{ secrets.PAYMOB_PUBLIC_KEY }}" ]; then
            DART_DEFINES+=(--dart-define=PAYMOB_PUBLIC_KEY="${{ secrets.PAYMOB_PUBLIC_KEY }}")
          fi
          if [ -n "${{ secrets.GOOGLE_WEB_CLIENT_ID }}" ]; then
            DART_DEFINES+=(--dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}")
          fi
          if [ -n "${{ secrets.GOOGLE_IOS_CLIENT_ID }}" ]; then
            DART_DEFINES+=(--dart-define=GOOGLE_IOS_CLIENT_ID="${{ secrets.GOOGLE_IOS_CLIENT_ID }}")
          fi
          flutter build apk --release "${DART_DEFINES[@]}"

      - name: Locate generated APK
        run: |
          find build/app/outputs -type f -name "*.apk" -print
          test -n "$(find build/app/outputs -type f -name "*.apk" -print -quit)"

      - name: Upload VSP Test Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vsp_app_release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
