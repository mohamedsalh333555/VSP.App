name: Build Android Release APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Final-phase gate: run manually only after source work and consolidated validation are complete.

on:
  workflow_dispatch:

jobs:
  build-release-apk:
    name: Build VSP Test Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h /

      - name: Prepare Firebase Android config
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "860837572098",
              "project_id": "vsp-app-103b1",
              "storage_bucket": "vsp-app-103b1.firebasestorage.app"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:860837572098:android:5a9d7594b32d94b1e5c11b",
                "android_client_info": {
                  "package_name": "app.vsp.sports"
                }
              },
              "api_key": [{
                "current_key": "AIzaSyBxfM4csK8u13t80oHOT8I9aMKGx-pe4EM"
              }]
            }]
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Configure original Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Original signing key secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD using the exact original VSP release keystore."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/vsp-release-key.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=vsp-release-key.jks
          EOF

      - name: Build signed Release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PAYMOB_PUBLIC_KEY: ${{ secrets.PAYMOB_PUBLIC_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        shell: bash
        run: |
          DART_DEFINES=()
          [[ -z "$SUPABASE_URL" ]] || DART_DEFINES+=(--dart-define=SUPABASE_URL="$SUPABASE_URL")
          [[ -z "$SUPABASE_ANON_KEY" ]] || DART_DEFINES+=(--dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY")
          [[ -z "$PAYMOB_PUBLIC_KEY" ]] || DART_DEFINES+=(--dart-define=PAYMOB_PUBLIC_KEY="$PAYMOB_PUBLIC_KEY")
          [[ -z "$GOOGLE_WEB_CLIENT_ID" ]] || DART_DEFINES+=(--dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID")
          [[ -z "$GOOGLE_IOS_CLIENT_ID" ]] || DART_DEFINES+=(--dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID")
          flutter build apk --release "${DART_DEFINES[@]}"

      - name: Locate generated APK
        run: |
          find build/app/outputs -type f -name "*.apk" -print
          test -n "$(find build/app/outputs -type f -name "*.apk" -print -quit)"

      - name: Upload VSP Test Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vsp_app_release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
