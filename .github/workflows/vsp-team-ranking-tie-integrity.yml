name: VSP Teams Ranking Tie Integrity
on:
  workflow_dispatch:
  push:
    branches: [uxlp-44-implementation]
    paths:
      - 'lib/features/player/widgets/champion/teams_ranking_tab.dart'
      - 'test/features/player/teams_ranking_discovery_test.dart'
      - '.github/workflows/vsp-team-ranking-tie-integrity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/player/widgets/champion/teams_ranking_tab.dart'
      - 'test/features/player/teams_ranking_discovery_test.dart'
      - '.github/workflows/vsp-team-ranking-tie-integrity.yml'
permissions:
  contents: read
jobs:
  tie-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos lib/features/player/widgets/champion/teams_ranking_tab.dart test/features/player/teams_ranking_discovery_test.dart
      - run: flutter test --concurrency=1 test/features/player/teams_ranking_discovery_test.dart
