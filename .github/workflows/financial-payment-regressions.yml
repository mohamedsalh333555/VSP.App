name: Financial payment regressions

permissions:
  contents: read

on:
  push:
    branches:
      - uxlp-44-implementation
    paths:
      - '.github/workflows/financial-payment-regressions.yml'
      - 'lib/data/models/booking_models.dart'
      - 'lib/core/utils/owner_financial_calculator.dart'
      - 'test/unit/financial_calculator_test.dart'
      - 'test/core/utils/owner_financial_calculator_test.dart'
      - 'test/architecture/paymob_verified_notification_contract_test.dart'
      - 'test/architecture/paymob_refund_accounting_notification_guard_test.dart'
      - 'supabase/functions/paymob_webhook/index.ts'
      - 'supabase/functions/create_paymob_intention/index.ts'
      - 'supabase/functions/_shared/paymob_hmac.ts'
      - 'supabase/functions/_shared/paymob_webhook_outcome.ts'
      - 'supabase/functions/_shared/paymob_order_binding.ts'
      - 'supabase/functions/_shared/paymob_integration_guard.ts'
      - 'supabase/functions/tests/paymob_hmac_test.ts'
      - 'supabase/functions/process_tournament_refund/index.ts'
      - 'supabase/functions/_shared/paymob_refund_safety.ts'
      - 'supabase/functions/_shared/paymob_audit_payload.ts'
      - 'supabase/functions/tests/paymob_refund_safety_test.ts'
      - 'supabase/functions/tests/paymob_booking_refund_safety_test.ts'
      - 'supabase/functions/process_paymob_refund/index.ts'
  workflow_dispatch:

concurrency:
  group: payment-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paymob-hmac-rejection-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.2.12"
      - name: Verify offline SHA-512 vectors and reject unsigned/untrusted logs
        run: deno test --no-config --allow-read supabase/functions/tests/paymob_hmac_test.ts supabase/functions/tests/paymob_refund_safety_test.ts supabase/functions/tests/paymob_booking_refund_safety_test.ts

  financial-methods-and-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Verify normalized venue cash vs wallets and financial receipts
        run: >-
          flutter test --concurrency=2
          test/core/utils/owner_financial_calculator_test.dart
          test/unit/financial_calculator_test.dart
          test/architecture/paymob_verified_notification_contract_test.dart
          test/architecture/paymob_refund_accounting_notification_guard_test.dart
