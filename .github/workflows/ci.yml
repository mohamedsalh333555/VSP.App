name: VSP Quality & CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze_test_build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Verify Firebase options are real source config
        run: test -s lib/firebase_options.dart
      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --coverage

      - name: Android debug build
        run: |
          flutter build apk --debug             --dart-define=SUPABASE_URL=https://mktqkddbcddrxjxabdua.supabase.co             --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"             --dart-define=PAYMOB_PUBLIC_KEY="${{ secrets.PAYMOB_PUBLIC_KEY }}"             --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"             --dart-define=GOOGLE_IOS_CLIENT_ID="${{ secrets.GOOGLE_IOS_CLIENT_ID }}"
