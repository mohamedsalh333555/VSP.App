name: Flutter CI

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only the newest branch state is actionable. Cancelling superseded runs
  # avoids exhausting hosted-runner quotas while a fix series is being pushed.
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [uxlp-44-implementation]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Verify real Firebase client options
        run: test -s lib/firebase_options.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Privacy and deletion regression gate
        run: >-
          flutter test --concurrency=2
          test/shared/account_deletion_dialog_test.dart
          test/shared/owner_delete_account_identity_test.dart
          test/core/services/image_selection_privacy_test.dart
          test/core/services/location_session_privacy_test.dart
          test/core/services/incomplete_account_cleanup_test.dart
          test/core/services/registration_profile_provisioning_test.dart
      - name: Architecture regression gate
        run: flutter test test/architecture
      - name: Test
        # Bound worker creation on hosted runners. The suite is large enough
        # that default CPU-based concurrency can exhaust the process/thread
        # quota and fail otherwise valid tests with `pthread_create failed`.
        run: flutter test --coverage --concurrency=2

      - name: Upload coverage for failed or successful test runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-${{ github.run_id }}
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Flutter CI commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_STATUS: ${{ job.status }}
        run: |
          if [ "$CI_STATUS" = "success" ]; then
            state=success
            description="Flutter analyze and tests passed"
          else
            state=failure
            description="Flutter analyze or tests failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="flutter-ci" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test "$state" = success
