name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Verify real Firebase client options
        run: test -s lib/firebase_options.dart
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze-report.txt
      - name: Upload analyzer report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyzer-report
          path: analyze-report.txt
          if-no-files-found: ignore
      - name: Test
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee test-report.txt
      - name: Upload test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-report
          path: test-report.txt
          if-no-files-found: ignore
      - name: Build Android debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://mktqkddbcddrxjxabdua.supabase.co \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=PAYMOB_PUBLIC_KEY="${{ secrets.PAYMOB_PUBLIC_KEY }}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="${{ secrets.GOOGLE_IOS_CLIENT_ID }}"
