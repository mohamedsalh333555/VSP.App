include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "scratch/**"
    - "bin/**"
    - "test/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    use_build_context_synchronously: error   # يحظر استخدام context بعد await بدون فحص mounted
    avoid_print: warning                     # يفرض استخدام VSPLogger
    cancel_subscriptions: warning            # يفرض إلغاء اشتراكات Stream لمنع تسريب الذاكرة
    close_sinks: warning                     # يفرض إغلاق Sinks/Controllers
    unawaited_futures: ignore
    deprecated_member_use: ignore
    unnecessary_import: ignore

linter:
  rules:
    avoid_print: true
    use_build_context_synchronously: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    avoid_unnecessary_containers: true
    cancel_subscriptions: true
    close_sinks: true
